<style>
.container {
  width: 200px;
  overflow: hidden;
  white-space: nowrap;
  background: black;
  color: white;
}
.marquee {
  display: inline-block;
  padding-left: 100%;
  animation: marquee 5s linear infinite;
}
@keyframes marquee {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-100%, 0); }
}
</style>
<div class="container">
  <div class="marquee">This is a long text that should scroll properly from right to left</div>
</div>
